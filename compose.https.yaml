services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      OIL_DOMAIN: ${OIL_DOMAIN:?Please set OIL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - oil-monitor
    security_opt:
      - no-new-privileges:true
volumes:
  caddy-data:
  caddy-config:
